# 放置路径: .github/workflows/update-graph.yml
# 作用: 每天定时拉取贡献数据、重新生成仓库共现图谱 SVG,并自动 commit 回仓库

name: Update contribution graph

on:
  schedule:
    - cron: "0 18 * * *"   # 每天 UTC 18:00(北京时间凌晨 2:00)运行,可按需调整
  workflow_dispatch: {}    # 允许手动在 Actions 页面点击运行

permissions:
  contents: write

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests networkx matplotlib

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GRAPH_PAT }}   # 需在仓库 Settings > Secrets 里新建这个 PAT
          GITHUB_LOGIN: ${{ github.repository_owner }}
          DAYS_BACK: "365"
          OUTPUT_PATH: "contribution-graph.svg"
        run: python contribution_graph.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-graph.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update contribution graph"
          git push
